[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vidigami-downloader"
version = "0.1.0"
description = "A privacy-first, local Vidigami media downloader and metadata tracker."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Vidigami Downloader Contributors" }]
dependencies = [
  "keyring>=25,<26",
  "Pillow>=10,<13",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
vidigami = "vidigami_downloader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidigami_downloader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vidigami_downloader"]
mypy_path = "src"
